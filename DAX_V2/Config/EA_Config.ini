[API_KEYS]
# Get your free NewsAPI key at: https://newsapi.org/register
NewsAPIKey=YOUR_NEWS_API_KEY_HERE

# Get your DeepSeek API key at: https://platform.deepseek.com/
DeepSeekAPIKey=YOUR_DEEPSEEK_API_KEY_HERE

[AI_SETTINGS]
# Enable/disable AI analysis (true/false)
UseAIAnalysis=true

# Enable/disable news filter (true/false)
UseNewsFilter=true

# AI analysis interval in seconds (minimum 300)
AIAnalysisInterval=300

# Risk-reward ratio for AI calculations
RiskRewardRatio=2.0

[RISK_MANAGEMENT]
# Maximum risk per trade as percentage
MaxRiskPerTrade=2.0

# Maximum daily loss as percentage
MaxDailyLoss=10.0

# Maximum drawdown as percentage
MaxDrawdown=15.0

# Use AI-based dynamic position sizing
DynamicPositionSizing=true

# Use AI-based dynamic stop loss
DynamicStopLoss=true

[GRID_MECHANICS]
# Grid distance in points
GridDistance=300

# Maximum pending orders per side
GridOrders=2

# Take profit in points
TakeProfit=200

# Stop loss in points
StopLoss=150

# Delete opposite grid on trigger
DeleteOpposite=true

[TRAILING]
# Break-even trigger in points
BreakEvenTrigger=100

# Break-even offset in points
BreakEvenOffset=15

# Trailing start in points
TrailingStart=140

# Trailing step in points
TrailingStep=30

[PROTECTION]
# Maximum allowed spread in points
MaxSpread=35

# EA Magic Number
MagicNumber=770022

[NEWS_FILTER]
# Minutes before high-impact news to enter caution mode
NewsCautionMinutes=30

# Confidence threshold during news (0.0-1.0)
NewsConfidenceThreshold=0.6

[SESSION_FILTER]
# Trading sessions (0=disabled, 1=enabled)
UseSessionFilter=true

# London session (UTC hours)
LondonSessionStart=7
LondonSessionEnd=16

# New York session (UTC hours)
NewYorkSessionStart=12
NewYorkSessionEnd=21

# Tokyo session (UTC hours)
TokyoSessionStart=0
TokyoSessionEnd=9

[LOGGING]
# Log level (0=minimal, 1=normal, 2=verbose)
LogLevel=1

# Save AI analysis to file
SaveAIAnalysis=true

# Save trade history with AI scores
SaveTradeHistory=true
