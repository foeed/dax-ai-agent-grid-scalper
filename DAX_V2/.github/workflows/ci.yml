name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd Backend
          pip install -r requirements.txt
          pip install ruff

      - name: Run ruff check
        run: cd Backend && ruff check .

      - name: Run ruff format check
        run: cd Backend && ruff format --check .

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: false
          tags: dax-ai-grid-scalper:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mql5-validate:
    name: MQL5 Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check MQ5 files exist and are non-empty
        run: |
          echo "Checking MQL5 source files..."
          for f in *.mq5 Include/*.mqh; do
            if [ -f "$f" ]; then
              echo "OK: $f ($(wc -l < "$f") lines)"
            else
              echo "MISSING: $f"
              exit 1
            fi
          done
          echo "All MQL5 source files present."
